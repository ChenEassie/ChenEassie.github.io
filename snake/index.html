<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; background: linear-gradient(135deg, #1a2a3a, #0d1117);
    font-family: "Microsoft YaHei", sans-serif; color: #eee; user-select: none;
  }
  h1 { margin-bottom: 10px; color: #4ade80; letter-spacing: 4px; }
  .info { display: flex; gap: 30px; margin-bottom: 12px; font-size: 18px; }
  .info span b { color: #facc15; }
  canvas {
    background: #16212e; border: 3px solid #4ade80; border-radius: 8px;
    box-shadow: 0 0 25px rgba(74, 222, 128, .35);
  }
  .tip { margin-top: 12px; font-size: 14px; color: #9ca3af; }
  .overlay {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center;
    gap: 12px; padding: 36px 44px 32px; z-index: 10;
    background: rgba(10, 18, 30, .88);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 18px; border: 1px solid rgba(74, 222, 128, .25);
    box-shadow: 0 8px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    min-width: 280px;
  }
  .overlay p { font-size: 22px; color: #f87171; }
  .overlay button {
    padding: 10px 30px; font-size: 17px; border: none; border-radius: 6px;
    background: #4ade80; color: #06281a; cursor: pointer; font-family: inherit;
    min-width: 140px;
  }
  .overlay button:hover { background: #22c55e; }
  .hidden { display: none !important; }

  /* ---- 主菜单 ---- */
  #menuTitle {
    color: #4ade80; font-size: 22px; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 2px;
    text-shadow: 0 0 18px rgba(74,222,128,.45);
    animation: glow 2.4s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 12px rgba(74,222,128,.3); }
    to   { text-shadow: 0 0 24px rgba(74,222,128,.65); }
  }
  #menuSub { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .diffCards { display: flex; gap: 12px; }
  .diffCard {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 18px 20px 14px; border-radius: 14px; cursor: pointer;
    border: 1.5px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.04);
    transition: all .22s ease; min-width: 80px; position: relative;
    font-family: inherit; color: #eee;
  }
  .diffCard:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 6px 20px rgba(0,0,0,.35), 0 0 12px var(--glow);
    background: rgba(255,255,255,.07);
  }
  .diffCard:active { transform: translateY(-1px) scale(.97); }
  .diffCard .icon { font-size: 28px; line-height: 1; }
  .diffCard .label { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
  .diffCard .desc  { font-size: 11px; color: #9ca3af; }
  .diffCard .speed {
    margin-top: 2px; display: flex; gap: 3px;
  }
  .diffCard .speed i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--dot-off, rgba(255,255,255,.12));
  }
  .diffCard .speed i.on { background: var(--accent); }

  /* 各难度配色 */
  .diffCard.easy   { --accent: #4ade80; --glow: rgba(74,222,128,.25); }
  .diffCard.normal { --accent: #facc15; --glow: rgba(250,204,21,.25); }
  .diffCard.hard   { --accent: #f87171; --glow: rgba(248,113,113,.25); }

  /* ---- 结算弹窗 ---- */
  #overText { color: #f87171; font-weight: 600; font-size: 24px; }
  #overBox .scoreBig {
    font-size: 48px; font-weight: 800; color: #facc15;
    text-shadow: 0 0 20px rgba(250,204,21,.4);
    line-height: 1.1;
  }
  #overBox .bestLine { font-size: 13px; color: #9ca3af; margin-bottom: 4px; }
  #overBox .newRecord {
    font-size: 13px; color: #4ade80; font-weight: 600;
    animation: glow 1.6s ease-in-out infinite alternate;
  }
  #overBox button {
    margin-top: 6px; padding: 11px 36px; font-size: 16px; border: none;
    border-radius: 8px; background: #4ade80; color: #06281a;
    cursor: pointer; font-family: inherit; font-weight: 600;
    transition: all .18s ease;
  }
  #overBox button:hover { background: #22c55e; transform: scale(1.04); }
</style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div class="info">
    <span>得分：<b id="score">0</b></span>
    <span>最高分：<b id="best">0</b></span>
    <span id="diffWrap" class="hidden">难度：<b id="diffText">普通</b></span>
  </div>
  <div style="position:relative">
    <canvas id="game" width="480" height="480"></canvas>

    <!-- 暂停提示 -->
    <div class="overlay hidden" id="pauseHint" style="padding:20px 36px;">
      <p style="color:#facc15; font-size:26px; font-weight:700;">⏸ 已暂停</p>
      <div style="font-size:13px; color:#9ca3af;">按空格继续</div>
    </div>

    <!-- 主菜单 -->
    <div class="overlay" id="menu">
      <p id="menuTitle">选择难度</p>
      <div id="menuSub">选择适合你的节奏</div>
      <div class="diffCards">
        <button class="diffCard easy" onclick="startGame('easy')">
          <span class="icon">🐢</span>
          <span class="label">简单</span>
          <span class="desc">悠闲节奏 · 可穿墙</span>
          <span class="speed"><i class="on"></i><i></i><i></i></span>
        </button>
        <button class="diffCard normal" onclick="startGame('normal')">
          <span class="icon">🐇</span>
          <span class="label">普通</span>
          <span class="desc">标准体验</span>
          <span class="speed"><i class="on"></i><i class="on"></i><i></i></span>
        </button>
        <button class="diffCard hard" onclick="startGame('hard')">
          <span class="icon">⚡</span>
          <span class="label">困难</span>
          <span class="desc">极限挑战</span>
          <span class="speed"><i class="on"></i><i class="on"></i><i class="on"></i></span>
        </button>
      </div>
    </div>

    <!-- 结算 -->
    <div class="overlay hidden" id="overBox">
      <p id="overText">游戏结束</p>
      <div class="scoreBig" id="finalScore">0</div>
      <div class="bestLine" id="bestLine"></div>
      <div class="newRecord hidden" id="newRecord">🎉 新纪录！</div>
      <button id="restartBtn">返回菜单</button>
    </div>
  </div>
  <p class="tip">方向键 / WASD / 鼠标点击 移动 · 空格暂停 · ESC 返回菜单</p>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 24, COLS = canvas.width / GRID, ROWS = canvas.height / GRID;

const scoreEl = document.getElementById('score');
const bestEl  = document.getElementById('best');
const diffWrap = document.getElementById('diffWrap');
const diffText = document.getElementById('diffText');
const menu     = document.getElementById('menu');
const overBox  = document.getElementById('overBox');
const overText = document.getElementById('overText');

// 难度配置：速度 = 基准 / 倍率（倍率越大越快，间隔越短）
const BASE = 200;
const DIFF = {
  easy:   { label: '简单', speed: Math.round(BASE / 0.75), wallPass: true },  // 267ms，可穿墙
  normal: { label: '普通', speed: BASE,                    wallPass: false }, // 200ms
  hard:   { label: '困难', speed: Math.round(BASE / 1.25), wallPass: false }, // 160ms
};

let snake, dir, nextDir, food, score, best, speed, timer, currentDiff, paused;
let clickEffects = []; // 点击特效数组
let state = 'menu'; // 'menu' | 'playing' | 'over'
best = Number(localStorage.getItem('snakeBest') || 0);
bestEl.textContent = best;

function reset(diff) {
  clearInterval(timer);
  currentDiff = diff;
  paused = false;
  snake = [{x: 8, y: 12}, {x: 7, y: 12}, {x: 6, y: 12}];
  dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0};
  score = 0;
  speed = DIFF[diff].speed;   // 按难度设定初始速度
  scoreEl.textContent = 0;
  diffText.textContent = DIFF[diff].label;
  placeFood();
}

function placeFood() {
  do {
    food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 穿墙处理（仅简单模式）
  if (DIFF[currentDiff].wallPass) {
    if (head.x < 0) head.x = COLS - 1;
    else if (head.x >= COLS) head.x = 0;
    if (head.y < 0) head.y = ROWS - 1;
    else if (head.y >= ROWS) head.y = 0;
  } else {
    // 撞墙死亡
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { endGame(); return; }
  }

  // 撞自己死亡
  if (snake.some(s => s.x === head.x && s.y === head.y)) { endGame(); return; }

  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 1; scoreEl.textContent = score;
    placeFood();
    if (speed > 80) { speed -= 4; restartTick(); }
  } else { snake.pop(); }
  draw();
}

function tick() { timer = setInterval(() => { if (state === 'playing' && !paused) step(); }, speed); }
function restartTick() { clearInterval(timer); tick(); }

// 持续渲染循环（保证特效流畅）
(function renderLoop() {
  if (state !== 'menu') draw();
  requestAnimationFrame(renderLoop);
})();

function draw() {
  ctx.fillStyle = '#16212e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(255,255,255,.04)';
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i * GRID, 0); ctx.lineTo(i * GRID, canvas.height); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * GRID); ctx.lineTo(canvas.width, i * GRID); ctx.stroke();
  }
  
  // 绘制点击波纹特效
  for (let i = clickEffects.length - 1; i >= 0; i--) {
    const effect = clickEffects[i];
    ctx.strokeStyle = `rgba(74, 222, 128, ${effect.opacity})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(effect.x, effect.y, effect.radius, 0, Math.PI * 2);
    ctx.stroke();
    
    // 更新特效状态
    effect.radius += 2;
    effect.opacity -= 0.04;
    
    // 移除已消失的特效
    if (effect.opacity <= 0) {
      clickEffects.splice(i, 1);
    }
  }
  
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 3, 0, Math.PI * 2);
  ctx.fill();
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(74,222,128,${1 - i / (snake.length + 6)})`;
    ctx.beginPath();
    ctx.roundRect(s.x * GRID + 2, s.y * GRID + 2, GRID - 4, GRID - 4, 5);
    ctx.fill();
  });
}

function startGame(diff) {
  state = 'playing';
  reset(diff);
  menu.classList.add('hidden');
  overBox.classList.add('hidden');
  document.getElementById('pauseHint').classList.add('hidden');
  diffWrap.classList.remove('hidden');
  draw();
  tick();
}

function endGame() {
  state = 'over'; clearInterval(timer);
  const isRecord = score > best;
  if (isRecord) { best = score; localStorage.setItem('snakeBest', best); bestEl.textContent = best; }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestLine').textContent = '最高分：' + best;
  const nr = document.getElementById('newRecord');
  if (isRecord && score > 0) { nr.classList.remove('hidden'); } else { nr.classList.add('hidden'); }
  overBox.classList.remove('hidden');
}

function toMenu() {
  state = 'menu'; clearInterval(timer);
  overBox.classList.add('hidden');
  menu.classList.remove('hidden');
  diffWrap.classList.add('hidden');
}

const KEYS = {
  ArrowUp: {x: 0, y: -1}, KeyW: {x: 0, y: -1},
  ArrowDown: {x: 0, y: 1}, KeyS: {x: 0, y: 1},
  ArrowLeft: {x: -1, y: 0}, KeyA: {x: -1, y: 0},
  ArrowRight: {x: 1, y: 0}, KeyD: {x: 1, y: 0},
};

document.addEventListener('keydown', e => {
  if (e.code === 'Escape') { if (state === 'playing' || state === 'over') toMenu(); e.preventDefault(); return; }
  if (e.code === 'Space') {
    if (state === 'playing') {
      paused = !paused;
      const pauseHint = document.getElementById('pauseHint');
      if (paused) { pauseHint.classList.remove('hidden'); }
      else { pauseHint.classList.add('hidden'); }
    }
    e.preventDefault();
    return;
  }
  const d = KEYS[e.code];
  if (!d) return;
  e.preventDefault();
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
});

document.getElementById('restartBtn').addEventListener('click', toMenu);

// 鼠标点击控制方向 + 特效
canvas.addEventListener('click', e => {
  if (state !== 'playing' || paused) return;
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  
  // 添加点击波纹特效
  clickEffects.push({ x: cx, y: cy, radius: 8, opacity: 1 });
  
  const headX = snake[0].x * GRID + GRID / 2;
  const headY = snake[0].y * GRID + GRID / 2;
  const dx = cx - headX;
  const dy = cy - headY;
  let d;
  if (Math.abs(dx) >= Math.abs(dy)) {
    d = dx >= 0 ? {x: 1, y: 0} : {x: -1, y: 0};
  } else {
    d = dy >= 0 ? {x: 0, y: 1} : {x: 0, y: -1};
  }
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
});

// 一次性清理旧的最高分记录（仅首次加载生效，之后自动移除自身）
if (!localStorage.getItem('snakeScoreReset')) {
  localStorage.removeItem('snakeBest');
  localStorage.setItem('snakeScoreReset', '1');
  best = 0; bestEl.textContent = 0;
}

reset('normal'); draw();   // 开局只画画面，等选难度
</script>
</body>
</html>
